<!DOCTYPE html>
<html lang="pt">
<head>

  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/favicon.ico" sizes="48x48">

  <link href="https://fonts.googleapis.com/css2?family=Gotu&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      background: radial-gradient(120% 70% at 50% 0%, #e3f3f8 0%, #f4fafc 45%, #ffffff 100%) no-repeat, #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .ty-header { padding: 20px 16px 0; display: flex; justify-content: center; }
    .ty-logo { display: block; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; transition: transform .2s ease; }
    .ty-logo:hover { transform: scale(1.05); }
    .ty-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .ty-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px 56px; }
    .ty-card { width: 100%; max-width: 560px; text-align: center; display: flex; flex-direction: column; align-items: center; }

    .ty-check {
      width: 64px; height: 64px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      color: #379cb7; background: rgba(55, 156, 183, 0.12);
      box-shadow: 0 0 0 10px rgba(55, 156, 183, 0.06);
      margin-bottom: 28px;
    }
    .ty-check svg { width: 30px; height: 30px; }
    .ty-check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: ty-draw .6s .25s cubic-bezier(.65,0,.35,1) forwards; }
    @keyframes ty-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ty-check path { animation: none; stroke-dashoffset: 0; } }

    .ty-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #2a87a0; margin: 0 0 14px; }
    .ty-title { font-family: "Gotu", serif; font-weight: 400; font-size: clamp(34px, 7vw, 52px); line-height: 1.12; letter-spacing: -0.01em; margin: 0 0 18px; text-wrap: balance; }
    .ty-text { font-size: 17px; line-height: 1.65; color: #475569; margin: 0 0 8px; max-width: 46ch; text-wrap: pretty; }
    .ty-hours { font-size: 14px; color: #64748b; margin: 0 0 32px; }

    .ty-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 14px 28px; border-radius: 16px;
      font-size: 16px; font-weight: 500; text-decoration: none;
      color: #ffffff; background: #379cb7;
      transition: background-color .2s ease;
    }
    .ty-primary:hover { background: #2e88a0; }
    .ty-primary:focus-visible, .ty-alt a:focus-visible, .ty-logo:focus-visible { outline: 2px solid #0f172a; outline-offset: 3px; }
    .ty-primary svg { width: 16px; height: 16px; }

    .ty-alt { margin-top: 40px; padding-top: 28px; border-top: 1px solid #e2e8f0; width: 100%; max-width: 420px; }
    .ty-alt p { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; margin: 0 0 14px; }
    .ty-alt-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ty-alt a {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; border-radius: 14px; text-decoration: none;
      font-size: 14.5px; font-weight: 500; color: #0f172a; background: #f1f5f9;
      transition: background-color .2s ease, color .2s ease;
    }
    .ty-alt a:hover { background: rgba(55, 156, 183, 0.14); color: #1f6f86; }
    .ty-alt svg { width: 18px; height: 18px; color: #379cb7; }

    .ty-footer { padding: 0 16px 28px; text-align: center; font-size: 12.5px; color: #94a3b8; }
    /* phone: keep the footer clear of the floating cookie/accessibility icons */
    @media (max-width: 979.98px) { .ty-footer { padding-bottom: 96px; } }
  </style>
</head>
